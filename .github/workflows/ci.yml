name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # npm run evals NÃO roda no CI: chama a API real da OpenAI (custo).
      # Rode localmente antes de mudar prompts (src/infrastructure/openai/prompts).
